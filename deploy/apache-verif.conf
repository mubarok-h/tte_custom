# Reverse proxy Apache untuk portal TTE.
# Simpan sebagai /etc/apache2/sites-available/verif.conf lalu:
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite verif
#   sudo systemctl reload apache2
#
# Untuk HTTPS:
#   sudo certbot --apache -d verif.stit-buntetpesantren.ac.id

<VirtualHost *:80>
    ServerName verif.stit-buntetpesantren.ac.id

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog  ${APACHE_LOG_DIR}/verif-error.log
    CustomLog ${APACHE_LOG_DIR}/verif-access.log combined
</VirtualHost>
